repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      # Lint + autofix
      - id: ruff
        name: ruff (lint+fix)
        args:
          - --fix
          - --exit-non-zero-on-fix
        types: [python]

      # Formatter
      - id: ruff-format
        name: ruff-format
        types: [python]