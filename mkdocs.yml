site_name: hsopt showroom
site_description: Agent-run Hamiltonian-simulation optimization experiments.
site_url: https://bestquark.github.io/hsopt/

theme:
  name: material
  logo: assets/hsopt-mark.svg
  favicon: assets/hsopt-mark.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

nav:
  - Showroom: index.md
  - Experiments:
      - Product-Formula T Counts: experiments/product-formulas.md
      - How T Gates Are Counted: experiments/t-gates.md
      - QSVT and LCU Directions: experiments/qsvt-lcu.md
  - Agent Loop: agent-loop.md
  - Try It: try-it.md

plugins:
  - search
  - encryptcontent:
      global_password: hsopt2026
      threshold_warning_min_entropy: 0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bestquark/hsopt
      name: bestquark/hsopt
