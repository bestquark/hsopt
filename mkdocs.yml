site_name: Trovolut
site_description: Hybrid quantum mechanics/molecular mechanics tooling.
repo_url: https://github.com/bestquark/trovolut
repo_name: bestquark/trovolut
site_dir: site
docs_dir: docs
watch:
  - mkdocs.yml
  - README.md
  - docs
  - src/trovolut

nav:
  - Home: index.md
  - API:
      - Overview: api/index.md
      - Modules:
          - QM Module: api/qm.md
          - MM Module: api/mm.md
          - Mixed Precision: api/mixed_fps.md
          - Interface: api/interface.md
          - Utils: api/utils.md
  - Tutorials:
      - Creating Hamiltonians: tutorials/dmds_hamiltonian.ipynb

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
    #   toggle:
    #     icon: material/weather-night
    #     name: Switch to dark mode
    # - scheme: slate
    #   primary: custom
    #   accent: custom
    #   toggle:
    #     icon: material/weather-sunny
    #     name: Switch to light mode
  logo: assets/nv-logo.png

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: "🔗"

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters:
              - "!^_"
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_submodules: true
            summary: true
  - encryptcontent:
      global_password: gordonbell2026
  - mkdocs-jupyter:
      execute: false 

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bestquark/trovolut

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
