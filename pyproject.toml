[project]
name = "trovolut"
version = "0.1.0"
description = "Evolutionary Trotterization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ase>=3.26.0",
  "imageio>=2.37.0",
  "matplotlib>=3.10.6",
  "mdtraj>=1.11.0",
  "numpy>=2.3.3",
  "openevolve>=0.2.14",
  "openfermion>=1.7.1",
  "openmm>=8.3.1",
  "openmmforcefields",
  "pyscf>=2.5.0",
  "rdkit>=2025.3.6",
  "scipy>=1.13",
  "zstandard>=0.25.0",
  "orjson>=3.11.3",
  "duckdb>=1.4.1",
  "ruff>=0.14.2",
  "scikit-image>=0.25.2",
]

[dependency-groups]
dev = [
  "black>=25.1.0",
  "pre-commit>=4.3.0",
  "ruff>=0.13.3",
]

docs = [
  "mkdocs>=1.6.1",
  "mkdocs-encryptcontent-plugin>=3.0.5",
  "mkdocs-material>=9.6.21",
  "mkdocstrings[python]>=0.30.1",
  "griffe",
  "pymdown-extensions>=10.16.1",
  "mkdocs-jupyter>=0.25.1",
]

gpu = [
  "nvidia-cupynumeric>=25.8.0",
  "legate>=25.8.0",
  "legate-profiler>=0.0.0",
  # pick one variant that matches your CUDA:
  # or: "cuquantum-cu11>=25.9.1",
  "cuquantum>=25.9.1",
]

[tool.uv]
package = true

[tool.uv.sources]
openmmforcefields = { git = "https://github.com/openmm/openmmforcefields" }

[tool.uv.workspace]
members = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "src/trovolut/utils/*",
    "src/trovolut/mm/*",
    "code_evolution/*"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
