[project]
name = "eqmmm"
version = "0.1.0"
description = "Mixed-precision QM/MM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ase>=3.26.0",
  "imageio>=2.37.0",
  "matplotlib>=3.10.6",
  "mdtraj>=1.11.0",
  "numpy>=2.3.3",
  "openevolve>=0.2.14",
  "openfermion>=1.7.1",
  "openmm>=8.3.1",
  "openmmforcefields",
  "pyscf>=2.5.0",
  "rdkit>=2025.3.6",
  "scipy>=1.13",
  "nvidia-cupynumeric>=25.8.0",
  "legate>=25.8.0",
  "legate-profiler>=0.0.0",
]


[dependency-groups]
dev = [
  "black>=25.1.0",
  "mkdocs>=1.6.1",
  "mkdocs-encryptcontent-plugin>=3.0.5",
  "mkdocs-material>=9.6.21",
  "mkdocstrings[python]>=0.30.1",
  "pre-commit>=4.3.0",
  "ruff>=0.13.3",
]
# cuda = [
#   "gpu4pyscf>=1.4.3; platform_system == 'Linux' and platform_machine == 'x86_64'",
# ]

[tool.uv]
package = true

[tool.uv.sources]
openmmforcefields = { git = "https://github.com/openmm/openmmforcefields" }

[tool.uv.workspace]
members = ["."]

[tool.setuptools.packages.find]
where = ["src"]
