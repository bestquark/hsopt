[project]
name = "hsopt"
version = "0.1.0"
description = "Agent-driven T-gate optimization for Hamiltonian simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26.4,<2",
  "pygridsynth>=1.1.0,<2",
  "reportlab>=4.4,<5",
  "scipy>=1.17.1,<1.18",
]

[project.scripts]
hsopt = "hsopt.exact_loop:main"
hsopt-baseline-drop = "hsopt.baseline_t_gate_drop:main"
hsopt-exact = "hsopt.exact_queue:main"
hsopt-exact-parity = "hsopt.exact_parity:main"
hsopt-export-exact = "hsopt.exact_export:main"
hsopt-loop = "hsopt.exact_loop:main"
hsopt-layout = "hsopt.repository_layout:main"
hsopt-nvpark = "hsopt.nvpark_queue:main"
hsopt-openshell = "hsopt.openshell_agent:main"
hsopt-paper-baseline = "hsopt.paper_baseline:main"
hsopt-paper-baseline-batch = "hsopt.paper_baseline_batch:main"
hsopt-campaign = "hsopt.campaign_setup:main"
hsopt-supervisor = "hsopt.exact_supervisor:main"
hsopt-reports = "hsopt.tgate_opt.reporting:main"
t-autoresearch = "hsopt.tgate_opt.t_autoresearch_cli:main"

[project.optional-dependencies]
cupynumeric = [
  "legate>=25.10.0; sys_platform == 'linux'",
  "nvidia-cupynumeric>=25.10.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.13.3",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
