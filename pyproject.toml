[project]
name = "hsopt"
version = "0.1.0"
description = "Agent-driven T-gate optimization for Hamiltonian simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3.3",
  "openfermion>=1.7.1",
  "pygridsynth>=1.1.0,<2",
  "pyscf>=2.5.0",
  "scipy>=1.13",
]

[project.scripts]
hsopt = "hsopt.tgate_opt.t_autoresearch_cli:main"
t-autoresearch = "hsopt.tgate_opt.t_autoresearch_cli:main"
t-gepa = "hsopt.tgate_opt.t_gepa_cli:main"

[project.optional-dependencies]
cupynumeric = [
  "legate>=25.10.0; sys_platform == 'linux'",
  "nvidia-cupynumeric>=25.10.0",
]

gepa = [
  "gepa",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.13.3",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"examples/ft_protocols/pfs/*/evaluate.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
