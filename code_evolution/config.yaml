# Configuration for function minimization example
max_iterations: 50
checkpoint_interval: 5

# LLM configuration
llm:
  api_base: "https://api.openai.com/v1"  # Or your LLM provider
  models:
    - name: "gpt-4o"
      weight: 1.0
  temperature: 0.5
  max_tokens: 2048
  timeout: 120

evaluator:
  cascade_evaluation: false    # Multi-stage testing

# Prompt configuration
prompt:
  system_message: "You are an expert programmer specializing in optimizing numerical simulations with quantization techniques. Your task is to maximize the combined score of the provided simulation code."

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
