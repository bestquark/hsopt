[project]
name = "hamlib-a100-autoresearch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py==3.16.0",
  "numpy==1.26.4",
  "pygridsynth==2.0.0",
]

[project.optional-dependencies]
gpu = [
  "legate==25.11.0",
  "nvidia-cupynumeric==25.11.0",
  "nvidia-cuda-runtime-cu12>=12.9,<13",
]

[tool.uv]
package = false
