name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra chemistry
      - name: Check formatting
        run: uv run --extra chemistry ruff format --check cli/src cli/tests
      - name: Lint
        run: uv run --extra chemistry ruff check .
      - name: Test runtime, installed commands, and CPU examples
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --extra chemistry pytest -q
      - name: Build distribution
        run: uv build
